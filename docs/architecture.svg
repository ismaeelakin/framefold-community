<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect width="1100" height="460" fill="#f3f6f3"/><g font-family="Arial,sans-serif" fill="#123b43"><text x="48" y="55" font-size="26" font-weight="bold">Framefold / the first collaboration</text><text x="48" y="85" font-size="14">Local creation. Portable proposals. A public place to improve the product.</text><g stroke="#bacdc8" fill="none"><rect x="48" y="140" width="280" height="190"/><rect x="410" y="140" width="280" height="190"/><rect x="772" y="140" width="280" height="190"/><path d="M328 220h82m-12-7 12 7-12 7M690 250h82m-12-7 12 7-12 7" stroke="#22656b" stroke-width="2"/></g><g font-size="19" font-weight="bold"><text x="70" y="182">Your browser</text><text x="432" y="182">A collaborator</text><text x="794" y="182">Public community</text></g><g font-size="15"><text x="70" y="219">Artwork + story panels</text><text x="70" y="248">Animation + review</text><text x="70" y="277">Local save + file export</text><text x="432" y="219">Open the same project</text><text x="432" y="248">Make a proposal</text><text x="432" y="277">Return it for selected review</text><text x="794" y="219">Questions + feedback</text><text x="794" y="248">Issues + public roadmap</text><text x="794" y="277">Documentation contributions</text></g><text x="48" y="385" font-size="14">Project exchange is manual. GitHub feedback is separate from private project files.</text><text x="48" y="412" font-size="14">Implementation remains in a private repository. No cloud collaboration service is implied.</text></g></svg>