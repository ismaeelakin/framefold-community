<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
<title id="title">Framefold: current alpha and proposed boundaries</title>
<desc id="description">Solid boxes describe released browser-local editing and a separate public GitHub community. Dashed boxes describe proposed local-engine work, 3D research and optional hosted services.</desc>
<defs><style>text{font-family:'Source Sans 3','Segoe UI',sans-serif;fill:#123b43}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.label{font-size:14px;letter-spacing:1px;font-weight:700}.live{fill:#fff;stroke:#22656b;stroke-width:2}.future{fill:#f3f6f3;stroke:#64817c;stroke-width:2;stroke-dasharray:7 6}</style></defs>
<rect width="1200" height="940" fill="#f3f6f3"/><rect x="48" y="38" width="12" height="38" fill="#d2e35b"/>
<text class="title" x="78" y="67">Framefold / system boundaries</text><text class="body" x="48" y="101">Solid: released alpha 0.14.0. Dashed: proposed or conditional work.</text>
<text class="label" x="48" y="145">CURRENT SYSTEM</text>
<rect class="live" x="48" y="166" width="716" height="234" rx="4"/>
<text class="heading" x="72" y="203">Your browser</text><text class="body" x="72" y="239">Artwork, scene evaluation and local rendering</text><text class="body" x="72" y="270">Motion, story panels and selected-change review</text><text class="body" x="72" y="301">Transactional workspace, checkpoints and backups</text><line x1="72" y1="323" x2="738" y2="323" stroke="#bacdc8"/>
<text class="small" x="72" y="351">Outputs: PNG / contact sheet / fixed-frame scene / storyboard WebM</text><text class="small" x="72" y="378">Collaboration: manual project and proposal file exchange</text>
<rect class="live" x="800" y="166" width="352" height="234" rx="4"/>
<text class="heading" x="824" y="203">Public GitHub community</text><text class="body" x="824" y="244">Guides and capability register</text><text class="body" x="824" y="277">Issues and Discussions</text><text class="body" x="824" y="310">Roadmap and research conditions</text><text class="small" x="824" y="353">No automatic app-feedback sync</text><text class="small" x="824" y="379">No private project storage here</text>
<text class="label" x="48" y="453">SPECIFICATION REVIEW FIRST / NOT RELEASED</text>
<rect class="future" x="48" y="477" width="344" height="243" rx="4"/>
<text class="label" x="72" y="510">LOCAL FOUNDATION / G2–G5</text><text class="heading" x="72" y="547">Creation and delivery</text><text class="body" x="72" y="586">Versioned documents and assets</text><text class="body" x="72" y="617">Portable packages and efficient revisions</text><text class="body" x="72" y="648">Broader exports and shot sequences</text><text class="body" x="72" y="679">Cels, audio and portable review</text>
<rect class="future" x="428" y="477" width="344" height="243" rx="4"/>
<text class="label" x="452" y="510">CONDITIONAL RESEARCH / G7</text><text class="heading" x="452" y="547">3D and creative review</text><text class="body" x="452" y="586">Staging, rigs and mesh modelling</text><text class="body" x="452" y="617">Topology-aware change review</text><text class="body" x="452" y="648">Connected 2D/3D shots</text><text class="body" x="452" y="679">Explicit conflicts and validity gates</text>
<rect class="future" x="808" y="477" width="344" height="243" rx="4"/>
<text class="label" x="832" y="510">OPTIONAL SERVICES / G6, G8</text><text class="heading" x="832" y="547">Hosted collaboration</text><text class="body" x="832" y="586">Identity, permissions, invitations</text><text class="body" x="832" y="617">Private assets and revisions</text><text class="body" x="832" y="648">Opt-in feedback sync and viewing</text><text class="body" x="832" y="679">Hard quotas; zero-spend gate</text>
<rect x="48" y="763" width="1104" height="126" fill="#123b43" rx="4"/>
<text x="72" y="800" style="fill:#d2e35b;font-size:20px;font-weight:700">Local work must remain useful without hosted services.</text><text x="72" y="834" style="fill:#f3f6f3;font-size:17px">Private implementation and full design packets stay separate from public documentation.</text><text x="72" y="864" style="fill:#f3f6f3;font-size:17px">Research is not a shipped feature. Free static hosting is not unlimited private-media storage.</text>
<text class="small" x="48" y="920">Public architecture summary · See ROADMAP.md and SPECIFICATION.md for gates.</text>
</svg>